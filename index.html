<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --warning-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --danger-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --dark-gradient: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #4b93a2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 60px rgba(0, 0, 0, 0.2);
        }

        .header {
            padding: 2rem 0;
            text-align: center;
            color: white;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: fadeInDown 1s ease;
            background: linear-gradient(45deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.2rem;
            margin-top: 0.5rem;
            animation: fadeInUp 1s ease 0.2s both;
            opacity: 0.9;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-form {
            margin-bottom: 3rem;
            animation: slideInLeft 0.8s ease;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .form-control,
        .btn {
            border-radius: 15px;
            border: none;
            transition: all 0.3s ease;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 15px 20px;
            font-size: 1.1rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .btn-gradient {
            background: var(--success-gradient);
            color: white;
            padding: 15px 30px;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .btn-gradient:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            color: white;
        }

        .btn-gradient::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-gradient:hover::before {
            left: 100%;
        }

        .task-card {
            margin-bottom: 1.5rem;
            animation: slideInRight 0.6s ease;
            transition: all 0.3s ease;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .task-card:hover {
            transform: translateY(-8px) scale(1.02);
        }

        .task-card.completed {
            opacity: 0.7;
            transform: scale(0.98);
        }

        .task-card.completed:hover {
            opacity: 1;
            transform: translateY(-8px) scale(1.02);
        }

        .task-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .task-title.completed {
            text-decoration: line-through;
            color: #666;
        }

        .task-description {
            color: #555;
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .task-meta {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 1rem;
        }

        .btn-action {
            border-radius: 50px;
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin: 0 5px;
            transition: all 0.3s ease;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .btn-complete {
            background: var(--warning-gradient);
            color: white;
        }

        .btn-edit {
            background: var(--success-gradient);
            color: white;
        }

        .btn-delete {
            background: var(--danger-gradient);
            color: white;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-action::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }

        .btn-action:active::after {
            width: 300px;
            height: 300px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin: 3rem 0;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .stats-card {
            text-align: center;
            color: white;
            margin-bottom: 2rem;
            animation: fadeInUp 1s ease 0.4s both;
        }

        .stats-number {
            font-size: 3rem;
            font-weight: 800;
            display: block;
        }

        .stats-label {
            font-size: 1rem;
            opacity: 0.8;
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 4rem 2rem;
            animation: fadeInUp 0.8s ease;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .floating-action {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--secondary-gradient);
            color: white;
            border: none;
            font-size: 1.5rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .floating-action:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
        }

        .modal-header {
            border-bottom: 1px solid var(--glass-border);
        }

        .modal-title {
            color: #333;
            font-weight: 700;
        }

        .fade-enter {
            opacity: 0;
            transform: scale(0.8);
        }

        .fade-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: all 0.3s ease;
        }

        .fade-exit {
            opacity: 1;
            transform: scale(1);
        }

        .fade-exit-active {
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }

            .container {
                padding: 0 1rem;
            }

            .task-card {
                margin-bottom: 1rem;
            }

            .btn-action {
                margin: 2px;
                padding: 6px 15px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_BASE_URL = 'https://deveps.ddns.net/api/tasks';

        function TasksApp() {
            const [tasks, setTasks] = useState([]);
            const [loading, setLoading] = useState(true);
            const [formData, setFormData] = useState({
                title: '',
                description: ''
            });
            const [editingTask, setEditingTask] = useState(null);
            const [showModal, setShowModal] = useState(false);
            const [error, setError] = useState('');

            useEffect(() => {
                fetchTasks();
            }, []);

            const fetchTasks = async () => {
                try {
                    setLoading(true);
                    const response = await fetch(`${API_BASE_URL}/`);
                    if (response.ok) {
                        const data = await response.json();
                        setTasks(data);
                    } else {
                        setError('Error al cargar las tareas');
                    }
                } catch (error) {
                    setError('Error de conexión');
                    console.error('Error:', error);
                } finally {
                    setLoading(false);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.title.trim()) return;

                try {
                    const method = editingTask ? 'PUT' : 'POST';
                    const url = editingTask
                        ? `${API_BASE_URL}/${editingTask.id}/`
                        : `${API_BASE_URL}/`;

                    const response = await fetch(url, {
                        method,
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData),
                    });

                    if (response.ok) {
                        const data = await response.json();
                        if (editingTask) {
                            setTasks(tasks.map(task =>
                                task.id === editingTask.id ? data : task
                            ));
                        } else {
                            setTasks([data, ...tasks]);
                        }
                        resetForm();
                        setShowModal(false);
                    } else {
                        setError('Error al guardar la tarea');
                    }
                } catch (error) {
                    setError('Error de conexión');
                    console.error('Error:', error);
                }
            };

            const toggleTaskDone = async (task) => {
                try {
                    const response = await fetch(`${API_BASE_URL}/${task.id}/done/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                    });

                    if (response.ok) {
                        setTasks(tasks.map(t =>
                            t.id === task.id ? { ...t, done: !t.done } : t
                        ));
                    } else {
                        setError('Error al actualizar la tarea');
                    }
                } catch (error) {
                    setError('Error de conexión');
                    console.error('Error:', error);
                }
            };

            const deleteTask = async (id) => {
                if (!confirm('¿Estás seguro de que quieres eliminar esta tarea?')) return;

                try {
                    const response = await fetch(`${API_BASE_URL}/${id}/`, {
                        method: 'DELETE',
                    });

                    if (response.ok) {
                        setTasks(tasks.filter(task => task.id !== id));
                    } else {
                        setError('Error al eliminar la tarea');
                    }
                } catch (error) {
                    setError('Error de conexión');
                    console.error('Error:', error);
                }
            };

            const editTask = (task) => {
                setEditingTask(task);
                setFormData({
                    title: task.title,
                    description: task.description || ''
                });
                setShowModal(true);
            };

            const resetForm = () => {
                setFormData({ title: '', description: '' });
                setEditingTask(null);
            };

            const handleNewTask = () => {
                resetForm();
                setShowModal(true);
            };

            const completedTasks = tasks.filter(task => task.done).length;
            const totalTasks = tasks.length;

            return (
                <div className="container py-4">
                    <div className="header">
                        <h1><i className="fas fa-tasks me-3"></i>Tasks</h1>
                        <p>Organiza tu vida con estilo y eficiencia</p>
                    </div>

                    {error && (
                        <div className="alert alert-danger glass-card mb-4" role="alert">
                            <i className="fas fa-exclamation-triangle me-2"></i>
                            {error}
                        </div>
                    )}

                    <div className="row mb-4">
                        <div className="col-md-4">
                            <div className="glass-card p-4 stats-card">
                                <span className="stats-number">{totalTasks}</span>
                                <span className="stats-label">Total de Tareas</span>
                            </div>
                        </div>
                        <div className="col-md-4">
                            <div className="glass-card p-4 stats-card">
                                <span className="stats-number">{completedTasks}</span>
                                <span className="stats-label">Completadas</span>
                            </div>
                        </div>
                        <div className="col-md-4">
                            <div className="glass-card p-4 stats-card">
                                <span className="stats-number">{totalTasks - completedTasks}</span>
                                <span className="stats-label">Pendientes</span>
                            </div>
                        </div>
                    </div>

                    {loading ? (
                        <div className="loading">
                            <div className="spinner"></div>
                            <p>Cargando tareas...</p>
                        </div>
                    ) : tasks.length === 0 ? (
                        <div className="empty-state glass-card p-5">
                            <i className="fas fa-clipboard-list"></i>
                            <h3>¡No hay tareas aún!</h3>
                            <p>Crea tu primera tarea para comenzar a organizarte</p>
                            <button className="btn btn-gradient mt-3" onClick={handleNewTask}>
                                <i className="fas fa-plus me-2"></i>
                                Crear Primera Tarea
                            </button>
                        </div>
                    ) : (
                        <div className="row">
                            {tasks.map((task) => (
                                <div key={task.id} className="col-lg-6 mb-4">
                                    <div className={`glass-card p-4 task-card ${task.done ? 'completed' : ''}`}>
                                        <h5 className={`task-title ${task.done ? 'completed' : ''}`}>
                                            {task.done && <i className="fas fa-check-circle me-2 text-success"></i>}
                                            {task.title}
                                        </h5>
                                        {task.description && (
                                            <p className="task-description">{task.description}</p>
                                        )}
                                        <div className="task-meta">
                                            <i className="fas fa-calendar me-2"></i>
                                            {new Date(task.created_at).toLocaleString('es-ES')}
                                        </div>
                                        <div className="d-flex flex-wrap">
                                            <button
                                                className={`btn btn-action ${task.done ? 'btn-complete' : 'btn-complete'}`}
                                                onClick={() => toggleTaskDone(task)}
                                            >
                                                <i className={`fas ${task.done ? 'fa-undo' : 'fa-check'} me-1`}></i>
                                                {task.done ? 'Desmarcar' : 'Completar'}
                                            </button>
                                            <button
                                                className="btn btn-action btn-edit"
                                                onClick={() => editTask(task)}
                                            >
                                                <i className="fas fa-edit me-1"></i>
                                                Editar
                                            </button>
                                            <button
                                                className="btn btn-action btn-delete"
                                                onClick={() => deleteTask(task.id)}
                                            >
                                                <i className="fas fa-trash me-1"></i>
                                                Eliminar
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    <button
                        className="floating-action"
                        onClick={handleNewTask}
                        title="Nueva tarea"
                    >
                        <i className="fas fa-plus"></i>
                    </button>

                    {showModal && (
                        <div className="modal show d-block" tabIndex="-1">
                            <div className="modal-dialog modal-dialog-centered">
                                <div className="modal-content">
                                    <div className="modal-header">
                                        <h5 className="modal-title">
                                            <i className={`fas ${editingTask ? 'fa-edit' : 'fa-plus'} me-2`}></i>
                                            {editingTask ? 'Editar Tarea' : 'Nueva Tarea'}
                                        </h5>
                                        <button
                                            type="button"
                                            className="btn-close"
                                            onClick={() => setShowModal(false)}
                                        ></button>
                                    </div>
                                    <form onSubmit={handleSubmit}>
                                        <div className="modal-body">
                                            <div className="mb-3">
                                                <label htmlFor="title" className="form-label">
                                                    <i className="fas fa-heading me-2"></i>
                                                    Título *
                                                </label>
                                                <input
                                                    type="text"
                                                    className="form-control"
                                                    id="title"
                                                    value={formData.title}
                                                    onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                                                    placeholder="Escribe el título de la tarea..."
                                                    required
                                                    autoFocus
                                                />
                                            </div>
                                            <div className="mb-3">
                                                <label htmlFor="description" className="form-label">
                                                    <i className="fas fa-align-left me-2"></i>
                                                    Descripción
                                                </label>
                                                <textarea
                                                    className="form-control"
                                                    id="description"
                                                    rows="4"
                                                    value={formData.description}
                                                    onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                                                    placeholder="Describe los detalles de la tarea... (opcional)"
                                                ></textarea>
                                            </div>
                                        </div>
                                        <div className="modal-footer">
                                            <button
                                                type="button"
                                                className="btn btn-secondary"
                                                onClick={() => setShowModal(false)}
                                            >
                                                Cancelar
                                            </button>
                                            <button type="submit" className="btn btn-gradient">
                                                <i className="fas fa-save me-2"></i>
                                                {editingTask ? 'Actualizar' : 'Crear'} Tarea
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}
                    {showModal && <div className="modal-backdrop show"></div>}
                </div>
            );
        }

        ReactDOM.render(<TasksApp />, document.getElementById('root'));
    </script>
</body>

</html>
